  for (const k of flying) vis.push([k, theta(k, t)]);
  const jobs = [];
  leaves.forEach(L => { L.f.visible = L.b.visible = false; });
  vis.slice(0, leaves.length).forEach(([k, th], i) => {
    if (k >= NLEAF) return;
    const L = leaves[i]; L.f.visible = L.b.visible = true;
    const order = (th === 0 || th === Math.PI) ? 0 : 1 + flying.indexOf(k)*0.12;
    shapeLeaf(L, th, aR, aL, Y0 + 0.00035*order);
    const [pf, pb] = leafPages(k);
    jobs.push(getTex(pf).then(tx => { if (L.f.material.map !== tx) { L.f.material.map = tx; L.f.material.needsUpdate = true; } }));
    jobs.push(getTex(pb).then(tx => { if (L.b.material.map !== tx) { L.b.material.map = tx; L.b.material.needsUpdate = true; } }));
  });
  closerPivot.visible = closing;
  if (closing) {
    const th = Math.PI*(1 - cu), thick = Math.max(tL, 0.004);
    closer.scale.set(1, thick, 1); closer.position.set(PW/2, thick/2, 0);
    closerPivot.rotation.z = th; closerPivot.position.set(0, Y0 + tR + 0.0015, 0);
    jobs.push(getTex(FIRST).then(tx => { if (closeTop.map !== tx) { closeTop.map = tx; closeTop.needsUpdate = true; } }));
    jobs.push(getTex(leafPages(nLeft - 1)[1]).then(tx => { if (!closeBot.map || closeBot.map.source !== tx.source) { const c = tx.clone(); c.center.set(0.5, 0.5); c.rotation = Math.PI; c.needsUpdate = true; closeBot.map = c; closeBot.needsUpdate = true; } }));
  }
  await Promise.all(jobs);
  // câmera sem rolagem (vetor "up" no plano vertical da visada)
  const [tx, tz, dist, el, az, ap] = camAt(t);
  const e = THREE.MathUtils.degToRad(el), a = THREE.MathUtils.degToRad(az);
  camera.position.set(tx + dist*Math.cos(e)*Math.sin(a), dist*Math.sin(e), tz + dist*Math.cos(e)*Math.cos(a));
  camera.up.set(-Math.sin(e)*Math.sin(a), Math.cos(e), -Math.sin(e)*Math.cos(a));
  camera.lookAt(tx, 0.02, tz); camera.updateProjectionMatrix();
  bokeh.uniforms.focus.value = camera.position.distanceTo(new THREE.Vector3(tx, 0.02, tz));
  bokeh.uniforms.aperture.value = 0.0055*ap/ (1 + 0.0*dist);
  bokeh.uniforms.maxblur.value = 0.010*ap;
  for (const [p, pr] of texCache) { const k = Math.floor((p - FIRST)/2); if (k < nLeft - 3 && p !== FIRST && k !== nLeft - 1) { pr.then(x => x.dispose()); texCache.delete(p); } }
  return [nLeft, flying.length];
};
window.DURATION = DURATION;
// espera texturas da mesa
const waitTex = t => new Promise(r => { const chk = () => t.image && t.image.complete !== false && t.image.width ? r() : setTimeout(chk, 50); chk(); });
Promise.all([wC].map(waitTex)).then(() => { window.ready = true; });
</script></body></html>
