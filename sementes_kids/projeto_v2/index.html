<body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Sementes Kids v2 — mão puxa as folhas A4 da pilha; páginas originais do PDF como texturas (sem alteração)
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createHand } from './hand.js';


const W = 1080, H = 1920, DURATION = 24.0;
const PW = 0.707, PH = 1.0;                         // A4 (1 unidade = 297 mm)
const rnd = (() => { let s = 11; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const ease = u => { u = Math.min(Math.max(u, 0), 1); return u * u * (3 - 2 * u); };
const easeIO = u => { u = Math.min(Math.max(u, 0), 1); return u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3)/2; };
const easeOut = u => { u = Math.min(Math.max(u, 0), 1); return 1 - Math.pow(1 - u, 3); };
const easeIn = u => { u = Math.min(Math.max(u, 0), 1); return 1 - Math.cos(Math.PI * u / 2); };
const lerp = (a, b, u) => a + (b - a) * u;
const cl = (u) => Math.min(Math.max(u, 0), 1);

// pilha (de cima para baixo) — páginas do PDF "Sementes Kids – 400 Historinhas"
const STACKP = [6, 13, 15, 24, 31, 193, 204, 251, 256];
const PAGES = STACKP;
const NS = STACKP.length, TH = 0.0011;
const STACK = STACKP.map(() => ({x: (rnd() - 0.5) * 0.012, z: (rnd() - 0.5) * 0.012, r: (rnd() - 0.5) * 0.024}));
STACK[0] = {x: 0.006, z: 0.004, r: -0.018};
// puxadas: [folha, início]; cada uma revela a folha de baixo
const PULLS = [[0, 1.6], [1, 4.1], [2, 6.6], [3, 9.1], [4, 11.6], [5, 14.1], [6, 16.6]];
const pullOf = new Map(PULLS);
const A_END = 0.55, P_END = 0.75, PULL_END = 1.60;   // aproximação, apoio, puxada
const GRIP = {u: 0.19, v: 0.40};                     // onde as pontas dos dedos tocam (coord. da folha)
// tomada 2 (após o corte): folhas organizadas sobre a mesa
const CUT = 19.6;
const LAYOUT = [[0, -0.385, -1.085, -0.020], [1, 0.385, -1.075, 0.018], [5, -0.388, 0.000, 0.012], [3, 0.382, 0.010, -0.015], [7, -0.380, 1.080, -0.010]];
const PLACED = {k: 4, x: 0.386, z: 1.085, r: 0.016, t0: 19.75, t1: 20.95};  // Girafinha colocada pela mão
const waves = PAGES.map(() => [rnd() * 6.28, rnd() * 6.28, 1.5 + rnd() * 1.5, 1.2 + rnd() * 1.4]);
// ---------------- renderizador ----------------
const renderer = new THREE.WebGLRenderer({antialias: false, preserveDrawingBuffer: true});
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2119);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.32;
const camera = new THREE.PerspectiveCamera(30, W / H, 0.6, 24);

const sun = new THREE.DirectionalLight(0xfff1e0, 1.5);   // janela à esquerda
sun.position.set(-3.0, 2.6, -0.6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 10; sun.shadow.blurSamples = 20; sun.shadow.bias = -0.0006;
Object.assign(sun.shadow.camera, {left: -1.9, right: 1.9, top: 1.9, bottom: -1.9, near: 0.5, far: 9});
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xf4f6ff, 0x6b5440, 0.45));
const pool = new THREE.SpotLight(0xfff2e4, 3.0, 0, 0.65, 1.0, 1.4); pool.position.set(-2.0, 2.5, -0.3); pool.target.position.set(0.2, 0, 0); scene.add(pool, pool.target);

const tl = new THREE.TextureLoader();
const woodTex = n => { const t = tl.load(`tex/wood_${n}.jpg`); t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.repeat.set(11.3, 11.3); t.anisotropy = 16; return t; };
const wC = woodTex('Color'); wC.colorSpace = THREE.SRGBColorSpace;
const table = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({map: wC, normalMap: woodTex('NormalGL'), roughnessMap: woodTex('Roughness'), roughness: 0.8, normalScale: new THREE.Vector2(0.9, 0.9), color: 0xfff3e4}));
table.rotation.x = -Math.PI / 2; table.rotation.z = 0.04; table.receiveShadow = true; scene.add(table);

// lápis de cor discretos (canto inferior esquerdo)
function pencil(color, len) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.0115, 0.0115, len, 6), new THREE.MeshStandardMaterial({color, roughness: 0.42}));
  const wood = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0112, 0.045, 24), new THREE.MeshStandardMaterial({color: 0xd9b48a, roughness: 0.85}));
  const lead = new THREE.Mesh(new THREE.ConeGeometry(0.0035, 0.012, 16), new THREE.MeshStandardMaterial({color, roughness: 0.6}));
  wood.position.y = len / 2 + 0.0225; lead.position.y = len / 2 + 0.051;
  for (const m of [body, wood, lead]) { m.castShadow = m.receiveShadow = true; g.add(m); }
  g.rotation.z = Math.PI / 2; const o = new THREE.Group(); o.add(g); return o;
}
const PENCILS = [];
for (const [c, len, x, z, r] of [[0x3a9d5d, 0.52, -0.62, 0.86, 0.95], [0xe0533d, 0.48, -0.56, 0.93, 1.05], [0xf2b632, 0.50, -0.67, 0.99, 0.88]]) {
  const p = pencil(c, len); p.position.set(x, 0.0115, z); p.rotation.y = r; scene.add(p); PENCILS.push(p);
}

// ---------------- papel ----------------
const paperN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'); const id = g.createImageData(512, 512);
  let s = 5; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const h = new Float32Array(512 * 512); for (let i = 0; i < h.length; i++) h[i] = r();
  for (let k = 0; k < 2; k++) for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) { const i = y*512 + x; h[i] = (h[i] + h[y*512 + ((x+1) % 512)] + h[((y+1) % 512)*512 + x]) / 3; }
  for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) { const i = y*512 + x; id.data[4*i] = 128 + (h[y*512 + ((x+1) % 512)] - h[i]) * 300; id.data[4*i+1] = 128 + (h[((y+1) % 512)*512 + x] - h[i]) * 300; id.data[4*i+2] = 255; id.data[4*i+3] = 255; }
  g.putImageData(id, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 4); return t; })();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const NU = 28, NVv = 38;
function makeSheet(page) {
  const pos = new THREE.BufferAttribute(new Float32Array((NU+1)*(NVv+1)*3), 3);
  const uv = new Float32Array((NU+1)*(NVv+1)*2), idx = [];
  for (let j = 0; j <= NVv; j++) for (let i = 0; i <= NU; i++) { const n = j*(NU+1) + i; uv[2*n] = i/NU; uv[2*n+1] = 1 - j/NVv; }
  for (let j = 0; j < NVv; j++) for (let i = 0; i < NU; i++) { const a = j*(NU+1) + i, b = a + 1, c = a + NU + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', pos); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(idx);
  const tex = tl.load(`pg/p-${String(page).padStart(3, '0')}.jpg`); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = maxAniso;
  const front = new THREE.Mesh(g, new THREE.MeshStandardMaterial({map: tex, roughness: 0.82, normalMap: paperN, normalScale: new THREE.Vector2(0.16, 0.16), envMapIntensity: 0.6}));
  const back = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0xf6f4ef, roughness: 0.9, side: THREE.BackSide}));
  for (const m of [front, back]) { m.castShadow = m.receiveShadow = true; m.frustumCulled = false; scene.add(m); }
  return {front, back, pos, g, tex};
}
const sheets = PAGES.map(makeSheet);

// deformação: folha erguida pela ponta inferior direita (mais perto da câmera) — curva parabólica
const DIR = new THREE.Vector2(PW, PH).normalize();
function shape(S, x, z, rot, y, bend, wave = 0, wv = [0, 0, 2, 2]) {
  const p = S.pos.array, c = Math.cos(rot), s = Math.sin(rot);
  const half = (PW * DIR.x + PH * DIR.y) / 2;
  for (let j = 0; j <= NVv; j++) for (let i = 0; i <= NU; i++) {
    const n = j*(NU+1) + i; let u = (i/NU - 0.5) * PW, v = (j/NVv - 0.5) * PH;
    const q = Math.max(0, (u * DIR.x + v * DIR.y + half) / (2 * half));   // 0 = canto oposto, 1 = canto erguido
    const lift = bend * q * q;
    // conserva o comprimento do papel: o canto erguido recua um pouco
    const pull = bend * bend * q * q * q * 0.9;
    u -= DIR.x * pull; v -= DIR.y * pull;
    const wav = wave * (0.5 + 0.5 * Math.sin(wv[2] * u * 6.28 + wv[0]) * Math.sin(wv[3] * v * 6.28 + wv[1]));
    p[3*n] = x + u * c - v * s; p[3*n+1] = y + lift + wav; p[3*n+2] = z + u * s + v * c;
  }
  S.pos.needsUpdate = true; S.g.computeVertexNormals();
}


// ---------------- câmera (celular na mão, de cima) ----------------
// [t, alvoX, alvoZ, dist, elev°, azim°, desfoque]
const Wd = (t) => [t, 0.02, 0.19, 2.62, 85, -2, 0.55];              // enquadramento da folha inteira + mão
const CLOSE = { // aproximações suaves nas ilustrações / versículos / atividades da folha revelada
  0: [0.13, -0.03, 1.80], 1: [0.12, -0.02, 1.78], 2: [-0.06, 0.22, 1.85], 3: [0.11, 0.00, 1.80], 4: [0.02, -0.12, 1.92],
  5: [0.00, 0.02, 1.95], 6: [0.00, 0.03, 2.00], 7: [0.00, 0.03, 1.95] };
const C = (t, k) => [t, CLOSE[k][0], CLOSE[k][1], CLOSE[k][2], 87, -1, 0.75];
const CAM1 = [C(0.0, 0), [0.9, 0.10, -0.01, 1.95, 86, -1, 0.7], Wd(1.95)];
PULLS.forEach(([k, t0], i) => { CAM1.push(Wd(t0 + 0.35), Wd(t0 + 1.35), C(t0 + 2.15, k + 1)); if (i < PULLS.length - 1) CAM1.push(C(t0 + 2.3, k + 1)); });
CAM1.push(C(CUT, 7));
CAM1.sort((a, b) => a[0] - b[0]);
const CAM2 = [[CUT, 0.00, 0.02, 6.55, 86, -2, 0.45], [21.5, 0.00, 0.02, 6.35, 86, -2, 0.45], [24.0, 0.00, 0.03, 6.05, 86, -1, 0.45]];
function spline(CAM, t) {
  let i = 0; while (i < CAM.length - 2 && CAM[i+1][0] <= t) i++;
  const P = k => CAM[Math.max(0, Math.min(CAM.length - 1, k))];
  const p0 = P(i-1), p1 = P(i), p2 = P(i+1), p3 = P(i+2);
  const u = Math.min(1, Math.max(0, (t - p1[0]) / (p2[0] - p1[0])));
  const out = [];
  for (let c = 1; c < 7; c++) { const a = p0[c], b = p1[c], cc = p2[c], d = p3[c];
    out.push(0.5*((2*b) + (-a + cc)*u + (2*a - 5*b + 4*cc - d)*u*u + (-a + 3*b - 3*cc + d)*u*u*u)); }
  return out;
}
// tremor natural de mão segurando o celular (baixa frequência)
const shake = (t, f, ph) => Math.sin(t * f + ph) * 0.6 + Math.sin(t * f * 2.13 + ph * 1.7) * 0.3 + Math.sin(t * f * 4.7 + ph * 0.3) * 0.1;
function camAt(t) {
  const o = t < CUT ? spline(CAM1, t) : spline(CAM2, t);
  o[0] += 0.0045 * shake(t, 1.1, 0.3); o[1] += 0.0045 * shake(t, 0.9, 1.9); o[2] += 0.012 * shake(t, 0.7, 2.6);
  o[3] += 0.35 * shake(t, 0.8, 4.1); o[4] += 0.45 * shake(t, 0.6, 5.2);
  return o;
}
const rt = new THREE.WebGLRenderTarget(W, H, {samples: 4, type: THREE.HalfFloatType});
const composer = new EffectComposer(renderer, rt); composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, {focus: 2.5, aperture: 0.0002, maxblur: 0.008}); composer.addPass(bokeh); composer.addPass(new OutputPass());

// ---------------- folhas ----------------
const HIDE = {hide: true};
function sheetAt(k, t) {
  if (t >= CUT) {
    const L = LAYOUT.find(l => l[0] === k);
    if (L) return {x: L[1], z: L[2], r: L[3], y: 0.0006 * (LAYOUT.indexOf(L) % 2), bend: 0, wave: 0.0030};
    if (k === PLACED.k) {
      const s = easeIO((t - PLACED.t0) / (PLACED.t1 - PLACED.t0));
      return {x: lerp(0.80, PLACED.x, s), z: lerp(1.80, PLACED.z, s), r: lerp(0.16, PLACED.r, s), y: 0.0035 * (1 - s) + 0.0012, bend: 0.025 * Math.sin(Math.PI * s), wave: 0.003};
    }
    return HIDE;
  }
  const st = STACK[k], nUnder = NS - 1 - k;
  let x = st.x, z = st.z, r = st.r, y = nUnder * TH, bend = 0;
  const t0 = pullOf.get(k);
  const isTop = k === 0 || (pullOf.has(k - 1) && t >= pullOf.get(k - 1) + PULL_END);  // a folha de cima já foi puxada
  let wave = isTop ? 0.0022 : 0;
  if (t0 !== undefined && t >= t0 + P_END) {
    const s = cl((t - t0 - P_END) / (PULL_END - P_END));
    if (s >= 1) return HIDE;                     // fora do quadro (com quem está filmando)
    const e = easeIn(s);
    z += 2.1 * e; x += 0.10 * e; r += 0.10 * e; y += 0.0035 * Math.min(1, s * 6) + 0.02 * e * e;
    bend = 0.035 * Math.sin(Math.PI * Math.min(1, s * 1.6)); wave = 0.003;
  } else if (t0 !== undefined && t >= t0 + A_END) {
    const s = cl((t - t0 - A_END) / (P_END - A_END)); bend = 0.012 * ease(s);   // pontas dos dedos pressionam e arrastam levemente
  }
  return {x, z, r, y, bend, wave};
}
// ponto da folha sob as pontas dos dedos (mundo)
function gripWorld(s) {
  const c = Math.cos(s.r), sn = Math.sin(s.r);
  return new THREE.Vector3(s.x + GRIP.u * c - GRIP.v * sn, s.y + 0.0, s.z + GRIP.u * sn + GRIP.v * c);
}
const PAD = 0.020;   // distância do osso da ponta do dedo até a polpa
function handAt(t) {
  if (t >= CUT) {
    const T0 = PLACED.t0 - 0.45, T1 = PLACED.t1, T2 = T1 + 0.9;
    if (t < T0 || t > T2) return null;
    const s = sheetAt(PLACED.k, Math.max(t, PLACED.t0)); s.u = GRIP.u; const g = gripWorld({...s}); g.y += 0.004 + PAD;
    if (t < PLACED.t0) { const a = easeOut((t - T0) / 0.45); g.x += 0.25 * (1 - a); g.z += 0.45 * (1 - a); g.y += 0.06 * (1 - a); return {P: g, yaw: 0.55, pitch: -0.26, w: 0.6 + 0.4 * a}; }
    if (t <= T1) return {P: g, yaw: 0.55 - 0.05 * Math.sin(Math.PI * cl((t - PLACED.t0) / (T1 - PLACED.t0))), pitch: -0.26, w: 1};
    const a = easeIn((t - T1) / 0.9); g.x += 0.55 * a; g.z += 1.6 * a; g.y += 0.10 * Math.sin(Math.PI * Math.min(1, a * 1.5)) * 0.6 + 0.02 * a;
    return {P: g, yaw: 0.55 + 0.1 * a, pitch: -0.26 + 0.12 * Math.min(1, a * 3), w: 1 - Math.min(1, a * 2.5)};
  }
  for (const [k, t0] of PULLS) {
    const u = t - t0; if (u < -0.05 || u > PULL_END + 0.05) continue;
    const base = sheetAt(k, Math.max(t, t0)); if (base.hide) { const s0 = sheetAt(k, t0 + PULL_END - 0.001); Object.assign(base, s0); }
    const g = gripWorld(base); g.y += PAD + 0.002;
    const yaw = 0.48 + 0.03 * Math.sin(k * 1.7), pitch = -0.27;
    if (u < A_END) { const a = easeOut(cl(u / A_END)); g.x += 0.30 * (1 - a); g.z += 0.95 * (1 - a); g.y += 0.10 * (1 - a) * (1 - a) + 0.015 * Math.sin(Math.PI * a);
      return {P: g, yaw: yaw + 0.08 * (1 - a), pitch: pitch + 0.10 * (1 - a), w: ease((a - 0.35) / 0.65)}; }
    if (u < P_END) return {P: g, yaw, pitch, w: 1};
    return {P: g, yaw: yaw + 0.05 * cl((u - P_END) / (PULL_END - P_END)), pitch: pitch + 0.05 * cl((u - P_END) / 0.5), w: 1};
  }
  return null;
}

const HAND = await createHand(scene);
window.renderAt = async function(t) {
  for (const p of PENCILS) p.visible = t < CUT;   // tomada 2: mesa só com as folhas
  for (let k = 0; k < PAGES.length; k++) { const s = sheetAt(k, t); const S = sheets[k];
    if (s.hide) { S.front.visible = S.back.visible = false; continue; }
    S.front.visible = S.back.visible = true; shape(S, s.x, s.z, s.r, s.y, s.bend, s.wave, waves[k]); }
  const h = handAt(t);
  if (h) { HAND.root.visible = true; HAND.place(h.P, h.yaw, h.pitch, 0, h.w); } else HAND.root.visible = false;
  const [tx, tz, dist, el, az, ap] = camAt(t);
  const e = THREE.MathUtils.degToRad(el), a = THREE.MathUtils.degToRad(az);
  camera.position.set(tx + dist * Math.cos(e) * Math.sin(a), dist * Math.sin(e), tz + dist * Math.cos(e) * Math.cos(a));
  camera.up.set(-Math.sin(e) * Math.sin(a), Math.cos(e), -Math.sin(e) * Math.cos(a));
  camera.lookAt(tx, 0.01, tz); camera.updateProjectionMatrix();
  bokeh.uniforms.focus.value = camera.position.distanceTo(new THREE.Vector3(tx, 0.01, tz));
  bokeh.uniforms.aperture.value = 0.0050 * ap; bokeh.uniforms.maxblur.value = 0.009 * ap;
  composer.render();
  return h ? 1 : 0;
};
window.DURATION = DURATION;
const waitAll = () => new Promise(r => { const chk = () => [wC, ...sheets.map(s => s.tex)].every(t => t.image && t.image.width) ? r() : setTimeout(chk, 50); chk(); });
waitAll().then(() => { window.ready = true; });
</script></body></html>
